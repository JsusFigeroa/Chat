[package]
name = "servidor"
version = "0.1.0"
edition = "2024"

[dependencies]
crossbeam-channel = "0.5.15"
dashmap = "6.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
async-channel = "2.3.1"